name: "Mobile CodeQL"

on:
  push:
    branches: [main, dev, cg2]
    paths:
      - 'mobile/**'
      - 'android/**'
      - 'ios/**'
      - '.github/workflows/mobile-codeql.yml'
  pull_request:
    branches: [main, dev, cg2]
    paths:
      - 'mobile/**'
      - 'android/**'
      - 'ios/**'
      - '.github/workflows/mobile-codeql.yml'
  schedule:
    - cron: '30 1 * * 0'

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze-dart:
    name: Analyze Dart Code
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: |
          cd mobile
          flutter pub get

      - name: Initialize CodeQL (Dart)
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-and-quality
          build-mode: none

      - name: Perform CodeQL Analysis (Dart)
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript"

  analyze-native:
    name: Analyze Mobile Native Code (java-kotlin)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: |
          cd mobile
          flutter pub get

      - name: Create google-services.json for CI
        run: |
          mkdir -p mobile/android/app/src/debug
          mkdir -p mobile/android/app/src/main
          # Create minimal google-services.json if not present
          if [ ! -f "mobile/android/app/google-services.json" ]; then
            echo '{
              "project_info": {
                "project_number": "123456789",
                "firebase_url": "https://test.firebaseio.com",
                "project_id": "test-project",
                "storage_bucket": "test.appspot.com"
              },
              "client": [
                {
                  "client_info": {
                    "mobilesdk_app_id": "1:123456789:android:test",
                    "android_client_info": {
                      "package_name": "com.example.mobile"
                    }
                  },
                  "oauth_client": [],
                  "api_key": [
                    {
                      "current_key": "AIzaSyTestKey"
                    }
                  ],
                  "services": {
                    "appinvite_service": {
                      "other_platform_oauth_client": []
                    }
                  }
                }
              ],
              "configuration_version": "1"
            }' > mobile/android/app/google-services.json
          fi
          cp mobile/android/app/google-services.json mobile/android/app/src/debug/
          cp mobile/android/app/google-services.json mobile/android/app/src/main/

      - name: Build Android app (for CodeQL analysis)
        run: |
          cd mobile
          flutter build apk --debug
        continue-on-error: true

      - name: Initialize CodeQL (Java/Kotlin)
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          queries: security-and-quality
          build-mode: none

      - name: Perform CodeQL Analysis (Java/Kotlin)
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:java-kotlin"