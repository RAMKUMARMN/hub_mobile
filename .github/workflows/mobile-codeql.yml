name: Mobile CodeQL

on:
  push:
    branches: [main, dev, cg2]
    paths:
      - 'android/**'
      - 'ios/**'
      - '.github/workflows/mobile-codeql.yml'

  pull_request:
    branches: [main, dev, cg2]
    paths:
      - 'android/**'
      - 'ios/**'
      - '.github/workflows/mobile-codeql.yml'

  schedule:
    - cron: '30 1 * * 0'

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze Mobile Native Code
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        language:
          - java-kotlin

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4