name: cixiohub_mobile
description: CixioHub Flutter mobile app — iOS and Android.
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # STATE MANAGEMENT
  provider: ^6.0.0
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # NETWORKING & API
  http: ^1.2.2
  dio: ^5.7.0

  # LOCAL STORAGE
  shared_preferences: ^2.3.2
  hive_flutter: ^1.1.0

  # NAVIGATION
  go_router: ^14.3.0

  # FIREBASE & AUTHENTICATION
  firebase_core: ^3.6.0
  firebase_auth: ^5.1.1
  google_sign_in: ^6.2.1
  firebase_messaging: ^15.1.3

  # UI & THEMING
  cupertino_icons: ^1.0.8
  flutter_markdown: ^0.7.4
  table_calendar: ^3.0.9
  fl_chart: ^0.68.0

  # FILE HANDLING
  file_picker: ^8.1.2
  image_picker: ^1.1.2
  open_file: ^3.3.2
  path_provider: ^2.1.5
  path: ^1.9.0

  # NOTIFICATIONS
  flutter_local_notifications: ^17.2.1
  timezone: ^0.9.2

  # UTILITIES
  intl: ^0.18.1
  url_launcher: ^6.2.5
  flutter_dotenv: ^5.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # LINTING & CODE QUALITY
  flutter_lints: ^4.0.0

  # CODE GENERATION
  build_runner: ^2.4.13
  riverpod_generator: ^2.4.3

  # APP ICON GENERATION
  flutter_launcher_icons: ^0.14.3

# APP ICON CONFIGURATION
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  background_color_ios: "#0B1E6B"

# FLUTTER ASSETS & CONFIGURATION
flutter:
  uses-material-design: true

  # Assets
  assets:
    - assets/images/

  # Fonts (optional)
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic